The complex plane

<a href=http://primepuzzle.com/not.just.tiny.c/paper_puzzle_number_one.html><img src=complex_plane.jpg></a>

The polar form of a complex number

z = r(cos(&theta;) + i*sin(&theta;))

DeMoivre's Theorem:

if z = r(cos(&theta;) + i*sin(&theta;))
then z<sup>n</sup> = r<sup>n</sup>(cos(n&theta;) + i*sin(n&theta;)) 

Example:

z = (1 + i) = 2<sup>1/2</sup>(cos(&pi;/4) + i*sin(&pi;/4))
z<sup>1/2</sup> = 2<sup>1/4</sup>(cos(&pi;/8) + i*sin(&pi;/8)) =
2<sup>1/4</sup>(0.9238 + 0.3826i) = 1.0985 + 0.4549i
