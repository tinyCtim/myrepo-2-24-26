<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            /* Sets the image using a local file path or a web URL */
            background-image: url('steinberg.jpg'); 
            
            /* Prevents the image from repeating like a grid tile */
            background-repeat: repeat; 
            
            /* Resizes the image to cover the entire browser screen */
               background-size: cover; 
            
            /* Centers the image on the screen */
	           background-position: center; 
            
            /* Keeps the background fixed in place while scrolling */
               background-attachment: fixed; 
        }
    </style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Count the second</title>

<style>

    .container {
        background: white;
        max-width: 500px;
        margin: auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h1 {
        margin-top: 100px;  /* lrb */
    }

    .inputs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 25px 0;
    }

    .field {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    label {
        margin-bottom: 6px;
        font-weight: bold;
    }

    input {
        width: 80px;
        padding: 10px;
        font-size: 18px;
        text-align: center;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
    }

    #message {
        margin-top: 20px;
        color: #b00020;
    }

    .countdown {
        display: flex;
        justify-content: center;
        gap: 50px;
        margin-top: 50px;  /* lrb */
    }

    .number {
        font-size: 64px;
        font-weight: bold;
    }

    .label {
        font-size: 22px;
        margin-top: 5px;
    }
</style>
</head>

<body>

<center>

<br><br><br><br><br><br><br><br>

<div class="container">

<h1>Look Forward To Date</h1>

    <div class="inputs">

        <div class="field">
            <label for="month">Month</label>
            <input type="number"
                   id="month"
                   min="1"
                   max="12"
                   placeholder="8">
        </div>

        <div class="field">
            <label for="day">Day</label>
            <input type="number"
                   id="day"
                   min="1"
                   max="31"
                   placeholder="28">
        </div>

        <div class="field">
            <label for="hour">Hour</label>
            <input type="number"
                   id="hour"
                   min="0"
                   max="23"
                   placeholder="9">
        </div>

    </div>

    <button onclick="startCountdown()">Start Countdown</button>

    <div id="message"></div>

    <div class="countdown">

        <div>
            <div class="number" id="days">--</div>
            <div class="label">Days</div>
        </div>

        <div>
            <div class="number" id="hours">--</div>
            <div class="label">Hours</div>
        </div>

    </div>

</div>

<script>

let countdownInterval;

function startCountdown() {

    const month = parseInt(document.getElementById("month").value);
    const day = parseInt(document.getElementById("day").value);
    const hour = parseInt(document.getElementById("hour").value);

    const message = document.getElementById("message");

    message.textContent = "";

    if (isNaN(month) || isNaN(day) || isNaN(hour)) {
        message.textContent =
            "Please enter a month, day, and hour.";
        return;
    }

    const now = new Date();

    // Start by assuming the target is in the current year.
    let target = new Date(
        now.getFullYear(),
        month - 1,
        day,
        hour,
        0,
        0
    );

    /*
       If that date and time has already passed,
       assume the user means the same date next year.
    */
    if (target <= now) {
        target = new Date(
            now.getFullYear() + 1,
            month - 1,
            day,
            hour,
            0,
            0
        );
    }

    clearInterval(countdownInterval);

    updateCountdown(target);

    countdownInterval = setInterval(function () {
        updateCountdown(target);
    }, 1000);
}


function updateCountdown(target) {

    const now = new Date();

    let difference = target - now;

    if (difference <= 0) {
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";

        clearInterval(countdownInterval);

        return;
    }

    const millisecondsPerHour = 1000 * 60 * 60;
    const millisecondsPerDay = millisecondsPerHour * 24;

    const days =
        Math.floor(difference / millisecondsPerDay);

    const hours =
        Math.floor(
            (difference % millisecondsPerDay)
            / millisecondsPerHour
        );

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
}

</script>
</center>
</body>
</html>
